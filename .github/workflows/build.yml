name: Build APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Commit APK to branch
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/KimiAssistent-debug.apk
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add apk/KimiAssistent-debug.apk
          git commit -m "ci: собрать debug APK [skip actions]"
          git push origin HEAD:"$GITHUB_REF_NAME"
